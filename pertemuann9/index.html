<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    background-color: #f4f4f4;
}

/* Header */
header {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 10px 0;
}

header nav {
    margin-top: 10px;
}

header nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
}

/* Sections */
section {
    padding: 40px;
    text-align: center;
    margin: 10px;
}

section#home {
    background-color: #4CAF50;
    color: white;
}

section#about {
    background-color: #f9f9f9;
}

/* Footer */
footer {
    text-align: center;
    padding: 10px 0;
    background-color: #333;
    color: white;
}

    </style>
</head>
<body>
    <header>
        <h1>Header</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home">
        <h2>Welcome to Our Service</h2>
        <p>Your journey to success starts here.</p>
        <a href="#about">Learn More</a>
    </section>

    <section id="about">
        <h2>About Us</h2>
        <p>We provide the best service to help you succeed.</p>
    </section>
    <footer>
        <p>@Footer</p>
    </footer>
</body>
</html>
